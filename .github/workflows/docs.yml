# Builds the documentation site on every change, and publishes it from master.
#
# WHY GitHub Actions rather than `mkdocs gh-deploy`: gh-deploy commits the built
# site to a branch, which means generated output living in the repository and a
# token with write access to push it. Publishing from a workflow keeps the built
# site out of the history entirely and authenticates with the run's own identity.
#
# The build runs on pull requests too, without publishing. mkdocs is configured
# strict, so a link that does not resolve fails the build rather than shipping a
# broken instruction in a page someone is following at a bench.
name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: 'pip install --only-binary :all: -r docs/requirements.txt'

      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
