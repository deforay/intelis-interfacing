name: Build All Platforms

on:
  push:
    tags: ['v*']           # releases are cut by pushing a v* tag
  workflow_dispatch:        # and manual runs
    inputs:
      build_windows:
        description: 'Also build Windows installers (slow, ~20 min)'
        type: boolean
        default: false

# Read-only by default; only the two jobs that publish release assets are
# granted contents: write.
permissions:
  contents: read

# Each build job uploads its own installers to the release as soon as that
# platform finishes, so the Linux .deb is downloadable ~6 minutes in without
# waiting on the ~20 minute Windows leg. Actions minutes are free and unmetered
# on public repositories, so building both on every tag costs nothing.

jobs:
  # Fails in seconds on a version/tag mismatch, before any long build starts.
  # Also the single place the release tag is decided, so no two jobs can
  # disagree about what is being shipped.
  version-check:
    name: Check version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PKG_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./app/package.json').version")

          # These two drift silently: electron-builder takes the app version
          # while the release takes the root one, so a mismatch ships builds
          # labelled differently from the release they land on.
          if [ "$PKG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION but app/package.json=$APP_VERSION. Run 'npm run bump <version>'."
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$PKG_VERSION" ]; then
              echo "::error::Tag $REF_NAME does not match package.json version v$PKG_VERSION. The release would be published under the wrong tag."
              exit 1
            fi
            RELEASE_TAG="$REF_NAME"
          else
            RELEASE_TAG="v$PKG_VERSION"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $RELEASE_TAG"

  # Same lint/test/audit/build gate that guards master, reused rather than
  # duplicated. Nothing is built or published from an unverified commit.
  verify:
    name: Verify
    needs: version-check
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux x64
    needs: [version-check, verify]
    # Needed by the publish step below, which creates/updates the release.
    permissions:
      contents: write
    container:
      image: electronuserland/builder:latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-electron-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:prod

      - name: Build Linux package
        run: npx --no-install electron-builder --linux deb --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release/*.deb
          if-no-files-found: error
          retention-days: 7

      # Publishes as soon as Linux is done. Only from a tag: a manual run off a
      # branch produces run artifacts but must never touch a public release.
      - name: Publish Linux assets to ${{ needs.version-check.outputs.release_tag }}
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 — pinned: this step holds contents: write
        with:
          tag_name: ${{ needs.version-check.outputs.release_tag }}
          name: ${{ needs.version-check.outputs.release_tag }}
          generate_release_notes: true
          draft: false
          files: release/*.deb

      - name: List build artifacts (non-blocking)
        if: always()
        shell: bash
        run: |
          echo "Runner OS: ${RUNNER_OS}"
          [ -d release ] && ls -la release || echo "no release/ dir"
          ldd --version

  build-windows:
    # Pin to windows-2022 (Visual Studio 2022 / v17). The windows-latest image
    # now ships Visual Studio 2026 (v18), which the bundled node-gyp can't
    # detect — its PowerShell VS-finder overflows the stdio buffer
    # (ERR_CHILD_PROCESS_STDIO_MAXBUFFER) and reports the VS version as
    # "undefined", so compiling native deps (@vscode/sqlite3) fails.
    runs-on: windows-2022
    name: Build Windows x64
    needs: [version-check, verify]
    # Needed by the publish step below, which creates/updates the release.
    permissions:
      contents: write
    # Always build for a release tag so one tag push produces a complete
    # release. Manual runs keep it opt-in, since those are usually quick
    # Linux-only smoke builds.
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows == true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: windows-electron-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:prod

      - name: Build Windows package
        run: npx --no-install electron-builder --win portable nsis --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

      # Adds the .exe installers to the same release, whenever Windows lands.
      # If Linux got there first this updates that release; if Windows somehow
      # finishes first it creates it. Either order works.
      - name: Publish Windows assets to ${{ needs.version-check.outputs.release_tag }}
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 — pinned: this step holds contents: write
        with:
          tag_name: ${{ needs.version-check.outputs.release_tag }}
          name: ${{ needs.version-check.outputs.release_tag }}
          generate_release_notes: true
          draft: false
          files: release/*.exe

      - name: List build artifacts (non-blocking)
        if: always()
        shell: pwsh
        run: |
          "Runner OS: $env:RUNNER_OS"
          if (Test-Path release) { Get-ChildItem release } else { "no release/ dir" }
